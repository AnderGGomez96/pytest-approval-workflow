[pytest]
pythonpath = .
testpaths = tests
addopts = -ra --strict-markers
markers =
    smoke: verificación mínima de disponibilidad de la API
    flow: configuración de flujo, aprobadores y overrides
    request: ciclo de vida de solicitudes de conciliación
    inbox: bandejas recibidas y enviadas
    default: casos base de la API (health, recursos, auth)
    regresion: subconjunto de regresión de caminos críticos
