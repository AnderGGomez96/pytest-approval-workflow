name: Regresión e2e approval-workflow

on:
  repository_dispatch:
    types: [approval-workflow-deployed]
  workflow_dispatch:
    inputs:
      suite:
        description: "Subconjunto a ejecutar"
        type: choice
        options: [regresion, all]
        default: regresion
  schedule:
    - cron: "0 3 * * *"

concurrency:
  group: regresion-approval-live
  cancel-in-progress: false

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APPROVAL_BASE_URL: ${{ vars.APPROVAL_BASE_URL }}
      SUITE: ${{ github.event.inputs.suite || 'regresion' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run suite
        continue-on-error: ${{ github.event.inputs.suite == 'all' }}
        run: |
          mkdir -p reports
          if [ "$SUITE" = "all" ]; then
            pytest -q --junitxml=reports/junit.xml --html=reports/report.html --self-contained-html
          else
            pytest -q -m regresion --junitxml=reports/junit.xml --html=reports/report.html --self-contained-html
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ env.SUITE }}
          path: reports/
